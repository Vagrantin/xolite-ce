name: XOlite home-laber RPM
run-name: "Build XOlite home-laber RPM (Tag: ${{ github.ref_name }})"

on:
  push:
    tags:
      - 'v*-ce[0-9]*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Emergency release tag'
        required: false

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60

    steps:
      # ── 0. Checkout xolite-ce (patch, spec, public key live here) ────────
      - name: Checkout xolite-ce
        uses: actions/checkout@v4

      # Generates a clean safety fallback tag if run via orchestrator dispatch
      - name: Derive versions from tag
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.release_tag }}" ]; then
              TAG="${{ github.event.inputs.release_tag }}"
            else
              TAG="v-ce-automated-$(date +'%Y%m%d%H%M')-run${{ github.run_number }}"
            fi
          fi
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          echo "▶ Target release tag established as: ${TAG}"

      # ── 1. Install system dependencies ──────────────────────────────────
      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rpm rpm2cpio gnupg2

      # ── 2. Clone vatesfr/xen-orchestra at latest *released* xo-lite-v* tag ─
      - name: Detect latest released xo-lite tag
        id: xo-tag
        run: |
          LATEST_TAG=$(curl -sf \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/vatesfr/xen-orchestra/releases?per_page=10" \
            | jq -r '
                [.[] | select(.tag_name | test("^xo-lite-v")) | select(.assets | length > 0)]
                | first | .tag_name
              ')

          [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ] \
            && echo "❌ No released xo-lite-v* tag with assets found" && exit 1

          echo "tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "▶ Latest released xo-lite tag: ${LATEST_TAG}"

      - name: Clone xen-orchestra at latest tag
        run: |
          git clone --depth 1 \
            --branch "${{ steps.xo-tag.outputs.tag }}" \
            https://github.com/vatesfr/xen-orchestra.git
          echo "▶ Cloned at tag: ${{ steps.xo-tag.outputs.tag }}"

      # ── 3. Detect XO Lite version from package.json ──────────────────────
      - name: Detect XO Lite version
        id: xo-version
        run: |
          VERSION=$(jq -r '.version' \
            xen-orchestra/@xen-orchestra/lite/package.json)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "▶ XO Lite version: ${VERSION}"

      # ── 4. Apply community patch via modular patch pipeline ──────────────
      - name: Apply community patch
        run: |
          cd xen-orchestra
          
          # Create a symlink so scripts find both @xen-orchestra and patches at the same level
          ln -s "$GITHUB_WORKSPACE/patches" patches
          
          echo "── Running update_locales.sh ──"
          bash patches/update_locales.sh
          
          echo "── Running update-xolite-loader.sh ──"
          bash patches/update-xolite-loader.sh
          
          echo "── Running xoa-deploy-patcher (Rust tool) ──"
          chmod +x patches/xoa-deploy-patcher
          ./patches/xoa-deploy-patcher @xen-orchestra/lite/src/pages/xoa-deploy.vue
          
          echo "▶ Patch pipeline execution complete. Modified files:"
          git status --short
          echo "Add robots.txt for version prior to v0.22.0"
          XOLITEVERSION="${{steps.xo-version.outputs.version}}"
          if dpkg --compare-versions "$XOLITEVERSION" lt "0.22.0"; then
            echo "Version ${XOLITEVERSION} < v0.22.0 - Copying robots.txt into public"
            cp packages/xo-server/robots.txt @xen-orchestra/lite/public/robots.txt
          else 
            echo "Version ${XOLITEVERSION} >= v0.22.0 - robots.txt already present in upstream"
          fi

      # ── 5. Verify patch in source before building ────────────────────────
      - name: Verify patch in source
        run: |
          echo "── Checking lite.xen-orchestra.com try/catch is GONE ───────────────────"
          if grep -r --exclude=release.mjs 'lite\.xen-orchestra\.com' xen-orchestra/@xen-orchestra/lite/scripts/; then
            echo "❌ FAIL: lite.xen-orchestra.com still present in source"
            exit 1
          else
            echo "✅ PASS: lite.xen-orchestra removed"
          fi

          echo "── Checking community URL is PRESENT ───────────────────────"
          if grep -r 'xo-image' xen-orchestra/@xen-orchestra/lite/src/; then
            echo "✅ PASS: community URL found in source"
          else
            echo "❌ FAIL: community URL not found in source"
            exit 1
          fi

      # ── 6. Set up Node.js and Yarn ───────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '^22.13'
          cache: 'yarn'
          cache-dependency-path: xen-orchestra/yarn.lock

      - name: Enable Corepack
        run: |
          corepack enable
          cd xen-orchestra
          yarn --version

      # ── 7. Install dependencies and build ────────────────────────────────
      - name: Install dependencies
        working-directory: xen-orchestra
        run: yarn install --frozen-lockfile

      - name: Build XO Lite
        working-directory: xen-orchestra
        run: TURBO_TELEMETRY_DISABLED=1 yarn build:xo-lite

      # ── 8. Verify build output ───────────────────────────────────────────
      - name: Verify build output
        run: |
          DIST="xen-orchestra/@xen-orchestra/lite/dist"
          echo "▶ Build output:"
          ls -lh "${DIST}/"
          test -f "${DIST}/index.html" || (echo "❌ index.html missing"; exit 1)
          test -d "${DIST}/assets"     || (echo "❌ assets/ missing";    exit 1)

          echo "── Checking xoa.io is GONE ─────────────────────────────────"
          if grep -Irl 'xoa\.io' "${DIST}"; then
            echo "✅ PASS: xoa.io found in dist"
          else
            echo "❌ FAIL: xoa.io not found in dist"; exit 1
          fi

          echo "── Checking lite.xen-orchestra.com is GONE ─────────────────"
          if grep -Irl 'lite\.xen-orchestra\.com' "${DIST}"; then
            echo "❌ FAIL: lite.xen-orchestra.com still in built output"; exit 1
          else
            echo "✅ PASS: lite.xen-orchestra.com not found in dist"
          fi

          echo "── Checking community URL is PRESENT ───────────────────────"
          if grep -Irl 'xo-image' "${DIST}"; then
            echo "✅ PASS: community URL found in dist"
          else
            echo "❌ FAIL: community URL not found in dist"; exit 1
          fi
          echo "✅ Build output verified"

      # ── 9. Package tarball for rpmbuild ──────────────────────────────────
      - name: Inspect source tree before packaging
        run: |
          PKG="xen-orchestra/@xen-orchestra/lite"
          echo "── scripts/ ─────────────────────────────────────────────────"
          ls -la "${PKG}/scripts/" 2>/dev/null || echo "(no scripts/ dir)"
          echo "── Monorepo root (license files) ────────────────────────────"
          ls xen-orchestra/ | grep -iE 'license|changelog'
          echo "── Dist output ──────────────────────────────────────────────"
          ls -lh "${PKG}/dist/"

      - name: Package tarball for rpmbuild
        run: |
          VERSION="${{ steps.xo-version.outputs.version }}"
          PKG="xen-orchestra/@xen-orchestra/lite"
          REPO="xen-orchestra"
          TARBALL_DIR="xo-lite-ce-${VERSION}"

          mkdir "${TARBALL_DIR}"
          cp -a "${PKG}/dist/." "${TARBALL_DIR}/"
          cp "${PKG}/CHANGELOG.md" "${TARBALL_DIR}/"
          cp "${PKG}/scripts/xolite-loader.html" "${TARBALL_DIR}/xolite.html"

          if [ -f "${REPO}/LICENSE" ]; then
            cp "${REPO}/LICENSE" "${TARBALL_DIR}/LICENSE"
          elif [ -f "${REPO}/LICENSE.md" ]; then
            cp "${REPO}/LICENSE.md" "${TARBALL_DIR}/LICENSE"
          else
            echo "❌ No LICENSE file found"; exit 1
          fi

          echo "▶ Tarball contents:"
          ls -lh "${TARBALL_DIR}/"

          for f in index.html assets favicon.svg manifest.webmanifest \
                   xolite.html build.json LICENSE CHANGELOG.md; do
            test -e "${TARBALL_DIR}/${f}" \
              || (echo "❌ Missing: ${TARBALL_DIR}/${f}"; exit 1)
          done
          echo "✅ All expected files present"

          tar -czf "xo-lite-${VERSION}.tar.gz" "${TARBALL_DIR}/"

      # ── 10. Build RPM ─────────────────────────────────────────────────────
      - name: Set up rpmbuild directories
        run: mkdir -p ~/rpmbuild/{SOURCES,SPECS,RPMS,SRPMS,BUILD,BUILDROOT}

      - name: Copy sources and spec
        run: |
          VERSION="${{ steps.xo-version.outputs.version }}"
          cp "xo-lite-${VERSION}.tar.gz" ~/rpmbuild/SOURCES/xo-lite-ce-${VERSION}.tar.gz
          sed "s/^Version:.*/Version: ${VERSION}/" \
            "$GITHUB_WORKSPACE/SPECS/xo-lite-community.spec" \
            > ~/rpmbuild/SPECS/xo-lite-community.spec

      - name: Build RPM
        run: |
          rpmbuild -ba ~/rpmbuild/SPECS/xo-lite-community.spec \
            --define "_topdir $HOME/rpmbuild"

          NEW_RPM=$(find ~/rpmbuild/RPMS/noarch/ -name "xo-lite-ce-*.rpm" | head -1)
          echo "new_rpm=${NEW_RPM}" >> $GITHUB_ENV
          echo "▶ Built RPM: ${NEW_RPM}"
          rpm -qip "${NEW_RPM}"

      # ── 11. Import GPG key and configure for CI ───────────────────────────
      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --pinentry-mode loopback \
            --passphrase "${GPG_PASSPHRASE}" --import

          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          gpgconf --launch gpg-agent
          sleep 1

          echo "${GPG_PASSPHRASE}" | gpg --batch --pinentry-mode loopback \
            --passphrase-fd 0 --quiet --no-tty \
            -u "XCP-ng Community Edition" \
            --sign --output /dev/null /dev/null

      - name: Configure rpmmacros
        run: |
          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons \
            | awk -F: '/^sec/{print $5}' | head -1)
          echo "▶ Using key ID: ${GPG_KEY_ID}"
    
          cat > ~/.rpmmacros <<EOF
          %_signature gpg
          %_gpg_name XCP-ng Community Edition
          %_gpgbin /usr/bin/gpg2
          %__gpg_sign_cmd %{__gpg} gpg --batch --no-verbose --no-armor \
            --no-secmem-warning --pinentry-mode loopback \
            -u "%{_gpg_name}" -sbo %{__signature_filename} \
            --digest-algo sha256 %{__plaintext_filename}
          EOF
    
          echo "▶ rpmmacros written:"
          cat ~/.rpmmacros
      
      # ── 12. Sign RPM ──────────────────────────────────────────────────────
      - name: Sign community RPM
        run: |
          rpmsign --addsign \
            --define "_gpg_name XCP-ng Community Edition" \
            "${new_rpm}"
          echo "RPM signed: ${new_rpm}"

      # ── 13. Verify RPM signature ──────────────────────────────────────────
      - name: Verify RPM signature
        run: |
          rpm --import "$GITHUB_WORKSPACE/xcp-ng-ce-public.asc"
          echo "── RPM signature check ──────────────────────────────────────"
          rpm --checksig "${new_rpm}"
          rpm --checksig "${new_rpm}" | grep -q "digests signatures OK" \
            || (echo "❌ GPG signature missing from RPM"; exit 1)
          echo "✅ RPM signature verified"

      # ── 14. Publish signed RPM as GitHub Release ──────────────────────────
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body: |
            ## XO Lite Community Edition RPM

            Community build of XO Lite with patched deploy behavior:
            - `lite.xen-orchestra.com` removed
            - Deploy XOA points to community image URL

            ### Source
            - Built from tag `${{ steps.xo-tag.outputs.tag }}`
            - XO Lite version: `${{ steps.xo-version.outputs.version }}`

            ### Verification
            Import the public key before verifying:
            ```
            rpm --import https://github.com/vagrantin/xolite-ce/raw/main/RPM-GPG-KEY-xcp-ng-ce
            rpm --checksig xo-lite-community-*.noarch.rpm
            ```

            > Community build. Not supported by Vates.
          files: ${{ env.new_rpm }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
