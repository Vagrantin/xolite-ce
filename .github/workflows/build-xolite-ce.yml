name: XOlite home-laber RPM
run-name: "Build XOlite home-laber RPM (Tag: ${{ github.ref_name }})"

on:
  push:
    tags:
      - 'v*-ce[0-9]*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Emergency release tag'
        required: false

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60

    steps:
      # ── 0. Checkout xolite-ce (patch, spec, public key live here) ────────
      - name: Checkout xolite-ce
        uses: actions/checkout@v4

      # Generates a clean safety fallback tag if run via orchestrator dispatch
      - name: Derive versions from tag
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.release_tag }}" ]; then
              TAG="${{ github.event.inputs.release_tag }}"
            else
              TAG="v-ce-automated-$(date +'%Y%m%d%H%M')-run${{ github.run_number }}"
            fi
          fi
          echo "RELEASE_TAG=${TAG}" >> $GITHUB_ENV
          echo "▶ Target release tag established as: ${TAG}"

      # ── 1. Install system dependencies ──────────────────────────────────
      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rpm rpm2cpio cpio gnupg2

      # ── 2. Clone vatesfr/xen-orchestra at the *pinned* xo-lite-v* tag ─────
      # The pin lives in the UPSTREAM_TAG file at the repo root, so builds only
      # move when that file is deliberately bumped (same approach as xoa-hl).
      - name: Read pinned xo-lite tag
        id: xo-tag
        run: |
          TAG=$(tr -d ' \n' < UPSTREAM_TAG)
          [ -n "$TAG" ] || { echo "❌ UPSTREAM_TAG is empty"; exit 1; }
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "▶ Pinned xo-lite tag: ${TAG}"

      - name: Clone xen-orchestra at pinned tag
        run: |
          git clone --depth 1 \
            --branch "${{ steps.xo-tag.outputs.tag }}" \
            https://github.com/vatesfr/xen-orchestra.git
          echo "▶ Cloned at tag: ${{ steps.xo-tag.outputs.tag }}"

      # ── 3. Detect XO Lite version from package.json ──────────────────────
      - name: Detect XO Lite version
        id: xo-version
        run: |
          VERSION=$(jq -r '.version' \
            xen-orchestra/@xen-orchestra/lite/package.json)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "▶ XO Lite version: ${VERSION}"

      # ── 4. Apply community patch via modular patch pipeline ──────────────
      - name: Apply community patch
        run: |
          bash scripts/patch-source.sh xen-orchestra
          node ci/test-xoa-button.mjs xen-orchestra/@xen-orchestra/lite/src/components/XoaButton.vue
          node ci/test-deploy-secrets.mjs xen-orchestra/@xen-orchestra/lite/src/pages/xoa-deploy.vue
          cd xen-orchestra
          echo "Add robots.txt for version prior to v0.22.0"
          XOLITEVERSION="${{steps.xo-version.outputs.version}}"
          if dpkg --compare-versions "$XOLITEVERSION" lt "0.22.0"; then
            echo "Version ${XOLITEVERSION} < v0.22.0 - Copying robots.txt into public"
            cp packages/xo-server/robots.txt @xen-orchestra/lite/public/robots.txt
          else 
            echo "Version ${XOLITEVERSION} >= v0.22.0 - robots.txt already present in upstream"
          fi

      # ── 5. Verify patch in source before building ────────────────────────
      - name: Verify patch in source
        run: |
          echo "── Checking lite.xen-orchestra.com try/catch is GONE ───────────────────"
          if grep -r --exclude=release.mjs 'lite\.xen-orchestra\.com' xen-orchestra/@xen-orchestra/lite/scripts/; then
            echo "❌ FAIL: lite.xen-orchestra.com still present in source"
            exit 1
          else
            echo "✅ PASS: lite.xen-orchestra removed"
          fi

          echo "── Checking community URL is PRESENT ───────────────────────"
          if grep -r 'xo-image' xen-orchestra/@xen-orchestra/lite/src/; then
            echo "✅ PASS: community URL found in source"
          else
            echo "❌ FAIL: community URL not found in source"
            exit 1
          fi

      # ── 6. Set up Node.js and Yarn ───────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '^22.13'
          cache: 'yarn'
          cache-dependency-path: xen-orchestra/yarn.lock

      - name: Enable Corepack
        run: |
          corepack enable
          cd xen-orchestra
          yarn --version

      # ── 7. Install dependencies and build ────────────────────────────────
      - name: Install dependencies
        working-directory: xen-orchestra
        run: yarn install --frozen-lockfile

      - name: Build XO Lite
        working-directory: xen-orchestra
        run: TURBO_TELEMETRY_DISABLED=1 yarn build:xo-lite

      # ── 8. Verify build output ───────────────────────────────────────────
      - name: Verify build output
        run: |
          DIST="xen-orchestra/@xen-orchestra/lite/dist"
          echo "▶ Build output:"
          ls -lh "${DIST}/"
          test -f "${DIST}/index.html" || (echo "❌ index.html missing"; exit 1)
          test -d "${DIST}/assets"     || (echo "❌ assets/ missing";    exit 1)

          echo "── Checking xoa.io is GONE ─────────────────────────────────"
          if grep -Irl 'xoa\.io' "${DIST}"; then
            echo "✅ PASS: xoa.io found in dist"
          else
            echo "❌ FAIL: xoa.io not found in dist"; exit 1
          fi

          echo "── Checking lite.xen-orchestra.com is GONE ─────────────────"
          if grep -Irl 'lite\.xen-orchestra\.com' "${DIST}"; then
            echo "❌ FAIL: lite.xen-orchestra.com still in built output"; exit 1
          else
            echo "✅ PASS: lite.xen-orchestra.com not found in dist"
          fi

          echo "── Checking community URL is PRESENT ───────────────────────"
          if grep -Irl 'xo-image' "${DIST}"; then
            echo "✅ PASS: community URL found in dist"
          else
            echo "❌ FAIL: community URL not found in dist"; exit 1
          fi
          echo "✅ Build output verified"

      # ── 9. Package tarball for rpmbuild ──────────────────────────────────
      - name: Inspect source tree before packaging
        run: |
          PKG="xen-orchestra/@xen-orchestra/lite"
          echo "── scripts/ ─────────────────────────────────────────────────"
          ls -la "${PKG}/scripts/" 2>/dev/null || echo "(no scripts/ dir)"
          echo "── Monorepo root (license files) ────────────────────────────"
          ls xen-orchestra/ | grep -iE 'license|changelog'
          echo "── Dist output ──────────────────────────────────────────────"
          ls -lh "${PKG}/dist/"

      - name: Package tarball for rpmbuild
        run: |
          VERSION="${{ steps.xo-version.outputs.version }}"
          PKG="xen-orchestra/@xen-orchestra/lite"
          REPO="xen-orchestra"
          TARBALL_DIR="xo-lite-ce-${VERSION}"

          mkdir "${TARBALL_DIR}"
          cp -a "${PKG}/dist/." "${TARBALL_DIR}/"
          cp "${PKG}/CHANGELOG.md" "${TARBALL_DIR}/"
          cp "${PKG}/scripts/xolite-loader.html" "${TARBALL_DIR}/xolite.html"

          if [ -f "${REPO}/LICENSE" ]; then
            cp "${REPO}/LICENSE" "${TARBALL_DIR}/LICENSE"
          elif [ -f "${REPO}/LICENSE.md" ]; then
            cp "${REPO}/LICENSE.md" "${TARBALL_DIR}/LICENSE"
          else
            echo "❌ No LICENSE file found"; exit 1
          fi

          echo "▶ Tarball contents:"
          ls -lh "${TARBALL_DIR}/"

          for f in index.html assets favicon.svg manifest.webmanifest \
                   xolite.html build.json LICENSE CHANGELOG.md; do
            test -e "${TARBALL_DIR}/${f}" \
              || (echo "❌ Missing: ${TARBALL_DIR}/${f}"; exit 1)
          done
          echo "✅ All expected files present"

          tar -czf "xo-lite-${VERSION}.tar.gz" "${TARBALL_DIR}/"

      # ── 10. Build RPM ─────────────────────────────────────────────────────
      - name: Set up rpmbuild directories
        run: mkdir -p ~/rpmbuild/{SOURCES,SPECS,RPMS,SRPMS,BUILD,BUILDROOT}

      - name: Copy sources and spec
        run: |
          VERSION="${{ steps.xo-version.outputs.version }}"
          cp "xo-lite-${VERSION}.tar.gz" ~/rpmbuild/SOURCES/xo-lite-ce-${VERSION}.tar.gz
          cp "$GITHUB_WORKSPACE/SPECS/xo-lite-community.spec" ~/rpmbuild/SPECS/
          cp "$GITHUB_WORKSPACE/LICENSE" ~/rpmbuild/SOURCES/xo-lite-ce-LICENSE

          # Put the ce counter from the release tag (vX.Y.Z-ceN → N) into the
          # RPM Release field so every ce build has a distinct NEVRA — with a
          # fixed Release, consecutive ce builds produced identical filenames,
          # hiding which build actually landed in the ISO and preventing yum
          # upgrades between ce releases.
          case "${RELEASE_TAG}" in
            *-ce[0-9]*) CE_COUNTER="${RELEASE_TAG##*-ce}" ;;
            *)          CE_COUNTER="0.${{ github.run_number }}" ;;  # automated fallback tag, sorts below any real ce release
          esac
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "VERSION=${VERSION}"         >> $GITHUB_ENV
          echo "CE_COUNTER=${CE_COUNTER}"   >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}"     >> $GITHUB_ENV
          echo "▶ RPM Version/Release: ${VERSION} / ${CE_COUNTER}.g${SHORT_SHA}.xcpng8.3"

      # The runner's rpm 6 declares rpmlib(LargeFiles) on every package,
      # which dom0's rpm 4.11 rejects during yum install ("Error installing
      # packages"). Build with the EL9 rpm 4.14 that xcp-hl-release uses.
      - name: Build RPM in EL9 container
        run: |
          docker run --rm \
            --user root \
            -v "$HOME/rpmbuild:/root/rpmbuild" \
            -e "VERSION=${VERSION}" \
            -e "CE_COUNTER=${CE_COUNTER}" \
            -e "SHORT_SHA=${SHORT_SHA}" \
            rockylinux:9 \
            bash -c 'dnf -y -q install rpm-build && rpmbuild -ba \
              /root/rpmbuild/SPECS/xo-lite-community.spec \
              --define "_topdir /root/rpmbuild" \
              --define "_version ${VERSION}" \
              --define "_release ${CE_COUNTER}" \
              --define "_shortcommit ${SHORT_SHA}"'

          NEW_RPM=$(find ~/rpmbuild/RPMS/noarch/ -name "xo-lite-ce-*.rpm" | head -1)
          echo "new_rpm=${NEW_RPM}" >> $GITHUB_ENV
          echo "▶ Built RPM: ${NEW_RPM}"
          rpm -qip "${NEW_RPM}"

      - name: Verify dom0 payload compression and project license
        run: bash ci/check-rpm-payload.sh "${new_rpm}" LICENSE

      - name: Verify scriptlets contain no unexpanded macros
        run: |
          set -euo pipefail
          scripts=$(rpm -qp --scripts "${new_rpm}")
          echo "${scripts}"
          if grep -qE '^[[:space:]]*%' <<<"${scripts}"; then
            echo "Unexpanded RPM macro in scriptlets"; exit 1
          fi

      # ── 11. Import GPG key and configure for CI ───────────────────────────
      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "${GPG_PRIVATE_KEY}" | gpg --batch --pinentry-mode loopback \
            --passphrase "${GPG_PASSPHRASE}" --import

          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          gpgconf --launch gpg-agent
          sleep 1

          echo "${GPG_PASSPHRASE}" | gpg --batch --pinentry-mode loopback \
            --passphrase-fd 0 --quiet --no-tty \
            -u "XCP-ng Community Edition" \
            --sign --output /dev/null /dev/null

      # ── 12. Sign RPM with a dom0-readable signature format ────────────────
      # rpm 6 on the runner writes only the new OpenPGP signature tag, which
      # dom0's rpm 4.11 cannot see: ce35-37 shipped effectively unsigned.
      # Sign in rockylinux:9 instead, like the xcp-hl-release RPM.
      - name: Export GPG private key for container
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          gpg --batch --pinentry-mode loopback \
            --passphrase "${GPG_PASSPHRASE}" \
            --export-secret-keys "XCP-ng Community Edition" \
            > /tmp/xolite-signing.key
          chmod 600 /tmp/xolite-signing.key
          test -s /tmp/xolite-signing.key

      - name: Sign and verify RPM in EL9 container
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          SIGN_DIR=$(dirname "${new_rpm}")
          docker run --rm \
            --user root \
            -e "GPG_PASSPHRASE=${GPG_PASSPHRASE}" \
            -v /tmp/xolite-signing.key:/signing.key:ro \
            -v "${SIGN_DIR}:/signing" \
            -v "$GITHUB_WORKSPACE/ci/sign-rpm.sh:/sign-rpm.sh:ro" \
            rockylinux:9 bash /sign-rpm.sh

          docker run --rm \
            --user root \
            -v "$GITHUB_WORKSPACE/xcp-ng-ce-public.asc:/pubkey.asc:ro" \
            -v "${SIGN_DIR}:/signing:ro" \
            -v "$GITHUB_WORKSPACE/ci/verify-signed-dom0.sh:/verify.sh:ro" \
            rockylinux:9 bash /verify.sh

      # ── 13. Publish signed RPM as GitHub Release ───────────────────────
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body: |
            ## XO Lite Community Edition RPM

            Community build of XO Lite with patched deploy behavior:
            - `lite.xen-orchestra.com` removed
            - Deploy XOA points to community image URL

            ### Source
            - Built from tag `${{ steps.xo-tag.outputs.tag }}`
            - XO Lite version: `${{ steps.xo-version.outputs.version }}`

            ### Verification
            Import the public key before verifying:
            ```
            rpm --import https://github.com/Vagrantin/xolite-ce/raw/main/xcp-ng-ce-public.asc
            rpm --checksig xo-lite-ce-*.noarch.rpm
            ```

            On XCP-ng 8.3 dom0 this reports `NOKEY`. The RPM is signed by a
            signing subkey, and dom0's rpm 4.11 registers only the primary key
            on import. That is expected: on a host, trust runs through the
            signed `repomd.xml` of the XCP-HL repository instead. The command
            above verifies the package directly on any distro with rpm 4.13 or
            newer.

            > Community build. Not supported by Vates.
          files: ${{ env.new_rpm }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

