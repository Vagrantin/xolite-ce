name: Check deployment credential cleanup
on:
  pull_request:
    paths: ['patches/cleanup-deploy-secrets.py', 'ci/test-deploy-secrets.mjs', 'UPSTREAM_TAG', '.github/workflows/check-deploy-secrets.yml', '.github/workflows/build-xolite-ce.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git clone --depth 1 --branch "$(cat UPSTREAM_TAG)" https://github.com/vatesfr/xen-orchestra.git upstream
          page=upstream/@xen-orchestra/lite/src/pages/xoa-deploy.vue
          python3 patches/cleanup-deploy-secrets.py "$page"
          node ci/test-deploy-secrets.mjs "$page"
          if python3 patches/cleanup-deploy-secrets.py "$page"; then
            echo 'Unexpected acceptance of a missing landmark'; exit 1
          fi
