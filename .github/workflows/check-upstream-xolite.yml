name: Check XO Lite upstream drift

on:
  pull_request:
    paths:
      - 'UPSTREAM_TAG'
      - 'ci/check_upstream_xolite.py'
      - 'ci/test_check_upstream_xolite.py'
      - '.github/workflows/check-upstream-xolite.yml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test repository metadata parser
        run: python -m unittest discover -s ci -p 'test_check_upstream_xolite.py'
      - name: Report XCP-ng 8.3 updates drift on PRs
        if: github.event_name == 'pull_request'
        run: python ci/check_upstream_xolite.py --report-only
      - name: Alert on XCP-ng 8.3 updates drift
        if: github.event_name != 'pull_request'
        run: python ci/check_upstream_xolite.py
